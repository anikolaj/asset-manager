[project]
name = "asset-manager"
version = "0.1.0"
description = "Python application to analyze portfolio of assets and generate statistics and forecasts"
authors = [
    { name = "anikolaj", email = "anikolaj@umich.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "flask-restx>=1.3.2",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pymongo>=4.18.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scipy>=1.17.1",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]
